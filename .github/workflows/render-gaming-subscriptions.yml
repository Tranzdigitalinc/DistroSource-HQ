name: Render Gaming subscription previews

on:
  push:
    branches:
      - codex/gaming-subscriptions-fungies
    paths:
      - "lib/gaming/subscriptions/**"
      - "scripts/gaming/subscriptions/render.mjs"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gaming-subscriptions-fungies
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gaming:subscriptions:render
      - run: pnpm gaming:subscriptions:audit
      - name: Commit deterministic previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gaming/subscriptions
          git diff --cached --quiet || git commit -m "Render Gaming subscription previews"
          git push

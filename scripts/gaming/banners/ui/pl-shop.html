<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Plugin Suite — server shop</title>
<!-- Built interface for Plugin Suite: server shop menu. Prices are example config. -->
<link rel="stylesheet" href="/scripts/gaming/banners/ui/_kit.css" />
<link rel="stylesheet" href="/scripts/gaming/banners/ui/_mcgui.css" />
<style>
  .bg { background-image: url(/.gaming-render/mc-lobby.png); filter: blur(5px) brightness(0.5); }
  .wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; grid-template-columns: 230px auto 300px; gap: 20px; align-items: start; }
  .cats .c { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 6px; font-size: 16px; margin-bottom: 8px; background: #11121a; border: 3px solid #0b0c12; }
  .cats .c.on { box-shadow: inset 0 0 0 2px #5ee6da; background: #13262a; }
  .cats canvas { width: 32px; height: 32px; image-rendering: pixelated; }
  .items { display: grid; grid-template-columns: repeat(4, 150px); gap: 12px; }
  .it { background: #11121a; border: 3px solid #0b0c12; box-shadow: inset 0 0 0 2px #262a3a; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px; }
  .it canvas { width: 60px; height: 60px; image-rendering: pixelated; }
  .it .p { color: #f5cf4e; font-weight: 700; }
  .it.sel { box-shadow: inset 0 0 0 2px #5ee6da, 0 0 18px rgba(94,230,218,0.35); }
  .buy .row2 { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; border-top: 2px solid #262a3a; }
  .qty { display: flex; gap: 8px; margin: 12px 0; }
  .qty span { flex: 1; text-align: center; padding: 10px 0; border-radius: 6px; background: #11121a; border: 3px solid #0b0c12; font-weight: 700; }
  .qty span.on { box-shadow: inset 0 0 0 2px #5ee6da; }
  .go { text-align: center; padding: 14px 0; border-radius: 6px; background: #1f9e94; font-weight: 700; font-size: 17px; border: 3px solid #0d4f4a; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="mg cats" style="padding:16px">
    <div class="t" style="font-size:17px">Shop</div>
    <div class="c on"><canvas data-icon="block"></canvas>Blocks</div>
    <div class="c"><canvas data-icon="pick"></canvas>Tools</div>
    <div class="c"><canvas data-icon="bread"></canvas>Food</div>
    <div class="c"><canvas data-icon="potion"></canvas>Brewing</div>
    <div class="c"><canvas data-icon="book"></canvas>Enchants</div>
    <div class="c"><canvas data-icon="star"></canvas>Ranks</div>
  </div>
  <div class="mg">
    <div class="t">Blocks <span class="s">sell prices refresh hourly</span></div>
    <div class="items">
      <div class="it sel"><canvas data-icon="block"></canvas>Grass block<span class="p">$4 each</span></div>
      <div class="it"><canvas data-icon="chest"></canvas>Chest<span class="p">$32</span></div>
      <div class="it"><canvas data-icon="gem"></canvas>Gem block<span class="p">$1,200</span></div>
      <div class="it"><canvas data-icon="coin"></canvas>Gold block<span class="p">$640</span></div>
      <div class="it"><canvas data-icon="book"></canvas>Bookshelf<span class="p">$48</span></div>
      <div class="it"><canvas data-icon="apple"></canvas>Apple crate<span class="p">$20</span></div>
      <div class="it"><canvas data-icon="star"></canvas>Lantern<span class="p">$18</span></div>
      <div class="it"><canvas data-icon="key"></canvas>Crate key<span class="p">$2,500</span></div>
    </div>
  </div>
  <div class="mg buy">
    <div class="t" style="font-size:17px">Buy</div>
    <div style="display:flex;align-items:center;gap:14px"><canvas data-icon="block" style="width:64px;height:64px;image-rendering:pixelated"></canvas><div><b style="font-size:17px">Grass block</b><div style="color:#9aa0bb;font-size:13px">Stack of 64</div></div></div>
    <div class="qty"><span>1</span><span>16</span><span class="on">64</span><span>256</span></div>
    <div class="row2"><span>Price</span><span style="color:#f5cf4e">$256</span></div>
    <div class="row2"><span>Balance</span><span>$12,450</span></div>
    <div class="row2"><span>After</span><span>$12,194</span></div>
    <div class="go" style="margin-top:12px">Buy 64</div>
  </div>
</div>
<script src="/scripts/gaming/banners/ui/_pixel.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Sound Library — siren tone bank</title>
<!-- Built interface for Sound Library: an in-game siren controller using a tone bank. -->
<link rel="stylesheet" href="/scripts/gaming/banners/ui/_kit.css" />
<style>
  :root { --accent: #ff6b5b; }
  .bg { background-image: url(/.gaming-render/street-stream.png); }
  .ctl { position: absolute; right: 60px; bottom: 60px; width: 620px; border-radius: 22px; background: linear-gradient(180deg, #1b1f25, #0e1115); border: 1px solid #2b3139; box-shadow: 0 30px 80px rgba(0,0,0,0.7); padding: 20px 22px; }
  .ctl .hd { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .ctl .hd b { font: 800 15px/1 Bahnschrift, sans-serif; letter-spacing: 0.12em; }
  .leds { display: flex; gap: 6px; margin-left: auto; }
  .leds i { width: 26px; height: 10px; border-radius: 3px; background: #2a2f36; }
  .leds i.r { background: #ff3b4a; box-shadow: 0 0 12px #ff3b4a; }
  .leds i.b { background: #3c74ff; box-shadow: 0 0 12px #3c74ff; }
  .tones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tone { border-radius: 12px; background: #20252c; border: 1px solid #2e353f; padding: 12px 14px; }
  .tone b { font: 800 15px/1 Bahnschrift, sans-serif; letter-spacing: 0.06em; display: block; }
  .tone svg { height: 34px; width: 100%; margin-top: 8px; color: #ff9d8f; }
  .tone.on { background: rgba(255,107,91,0.16); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .tone .k { float: right; font: 700 11px/1 "Cascadia Mono", monospace; color: var(--muted); border: 1px solid #3a4250; border-radius: 5px; padding: 3px 6px; }
  .strip { display: flex; gap: 10px; margin-top: 14px; }
  .strip span { flex: 1; height: 46px; border-radius: 10px; background: #20252c; border: 1px solid #2e353f; display: grid; place-items: center; font: 800 13px/1 Bahnschrift, sans-serif; letter-spacing: 0.08em; color: #c9d3de; }
  .strip span.on { background: #ff3b4a; color: #fff; border-color: #ff3b4a; box-shadow: 0 0 20px rgba(255,59,74,0.45); }
  .bank { position: absolute; left: 60px; top: 60px; width: 470px; border-radius: 18px; background: rgba(10,14,20,0.9); border: 1px solid rgba(255,255,255,0.08); padding: 18px 20px; backdrop-filter: blur(10px); }
  .bank li { display: grid; grid-template-columns: 1fr 70px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .bank li:first-child { border-top: 0; }
  body.cover .bank { display: none; }
</style>
</head>
<body>
<div class="bg sharp"></div>
<div class="bank">
  <div class="h">Tone bank · harbor_sirens</div>
  <ul>
    <li><span><b>Wail</b> · long cycle</span><span class="mono muted">0:10</span></li>
    <li><span><b>Yelp</b> · fast</span><span class="mono muted">0:06</span></li>
    <li><span><b>Phaser</b> · priority</span><span class="mono muted">0:04</span></li>
    <li><span><b>Hi-lo</b> · EMS</span><span class="mono muted">0:08</span></li>
    <li><span><b>Air horn</b> · manual</span><span class="mono muted">0:03</span></li>
  </ul>
  <div class="muted" style="font-size:12px;margin-top:10px">Assigned to: patrol sedan, EMS van · streams on demand</div>
</div>
<div class="ctl">
  <div class="hd"><b>SIREN CONTROL</b><span class="pill bad">Code 3</span><div class="leds"><i class="r"></i><i class="b"></i><i class="r"></i><i class="b"></i><i class="r"></i><i class="b"></i></div></div>
  <div class="tones">
    <div class="tone on"><span class="k">1</span><b>WAIL</b><svg data-wave="7" data-shape="siren" data-bars="60" data-color="#ff9d8f" data-played="1"></svg></div>
    <div class="tone"><span class="k">2</span><b>YELP</b><svg data-wave="12" data-shape="siren" data-bars="60" data-dim="#4a5563"></svg></div>
    <div class="tone"><span class="k">3</span><b>PHASER</b><svg data-wave="19" data-shape="siren" data-bars="60" data-dim="#4a5563"></svg></div>
    <div class="tone"><span class="k">4</span><b>HI-LO</b><svg data-wave="27" data-shape="siren" data-bars="60" data-dim="#4a5563"></svg></div>
    <div class="tone"><span class="k">E</span><b>AIR HORN</b><svg data-wave="41" data-shape="horn" data-bars="60" data-dim="#4a5563"></svg></div>
    <div class="tone"><span class="k">R</span><b>RUMBLER</b><svg data-wave="48" data-shape="engine" data-bars="60" data-dim="#4a5563"></svg></div>
  </div>
  <div class="strip"><span class="on">LIGHTS</span><span class="on">SIREN</span><span>TAKEDOWN</span><span>ALLEY</span></div>
</div>
<script src="/scripts/gaming/banners/ui/_wave.js"></script>
<script>if (new URLSearchParams(location.search).get("cover")) document.body.classList.add("cover")</script>
</body>
</html>

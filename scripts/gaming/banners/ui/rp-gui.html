<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Resource Pack Studio — GUI skins</title>
<!-- Built interface for Resource Pack Studio: the Hearthside chest and inventory GUI skins, framed with the set's own
     plank texture. Item icons are original pixel art from _pixel.js. -->
<link rel="stylesheet" href="/scripts/gaming/banners/ui/_kit.css" />
<script>window.__ready = false</script>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/examples/jsm/": "/node_modules/three/examples/jsm/" } }</script>
<style>
  .bg { background-image: url(/.gaming-render/mc-cottage.png); filter: blur(6px) brightness(0.5); }
  .wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 40px; align-items: center; }
  .gui { padding: 18px; border-radius: 6px; image-rendering: pixelated; background-size: 64px 64px; box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 0 0 4px rgba(40,24,10,0.7); }
  .inner { background: #efe3c8; border: 4px solid #5f3d22; border-radius: 4px; padding: 16px; box-shadow: inset 0 0 0 3px #f7eedb; }
  .ttl { font: 800 20px/1 Bahnschrift, sans-serif; color: #5f3d22; letter-spacing: 0.04em; margin-bottom: 12px; }
  .g9 { display: grid; grid-template-columns: repeat(9, 66px); gap: 6px; }
  .s { width: 66px; height: 66px; background: #d8c7a3; border: 3px solid #b39870; box-shadow: inset 2px 2px 0 #9b7f58, inset -2px -2px 0 #f2e7d0; display: grid; place-items: center; position: relative; }
  .s canvas { width: 44px; height: 44px; image-rendering: pixelated; }
  .s b { position: absolute; right: 4px; bottom: 1px; color: #fff; font: 700 14px/1 "Cascadia Mono", monospace; text-shadow: 2px 2px 0 #3a2410; }
  .s.hl { border-color: #e07b2b; box-shadow: inset 2px 2px 0 #b8583a, inset -2px -2px 0 #ffcf7a, 0 0 0 2px #e07b2b; }
  .sep { height: 14px; }
  .note { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); display: flex; gap: 12px; }
  .note span { padding: 9px 14px; border-radius: 10px; background: rgba(23,19,15,0.85); border: 1px solid #3a2e22; color: #f3ead9; font-size: 13px; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="gui" id="chest">
    <div class="inner">
      <div class="ttl">Cottage chest</div>
      <div class="g9">
        <div class="s"><canvas data-icon="bread"></canvas><b>12</b></div><div class="s"><canvas data-icon="apple"></canvas><b>7</b></div><div class="s"></div><div class="s"><canvas data-icon="book"></canvas></div><div class="s"></div><div class="s"><canvas data-icon="coin"></canvas><b>24</b></div><div class="s"></div><div class="s"><canvas data-icon="potion"></canvas><b>2</b></div><div class="s"></div>
        <div class="s"></div><div class="s"><canvas data-icon="block"></canvas><b>64</b></div><div class="s"><canvas data-icon="block"></canvas><b>41</b></div><div class="s"></div><div class="s"><canvas data-icon="key"></canvas></div><div class="s"></div><div class="s"></div><div class="s"><canvas data-icon="star"></canvas><b>3</b></div><div class="s"></div>
        <div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"><canvas data-icon="chest"></canvas></div><div class="s"></div><div class="s"></div><div class="s"></div>
      </div>
      <div class="sep"></div>
      <div class="ttl">Inventory</div>
      <div class="g9">
        <div class="s"></div><div class="s"><canvas data-icon="gem"></canvas><b>5</b></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div>
        <div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div>
      </div>
      <div class="sep"></div>
      <div class="g9">
        <div class="s hl"><canvas data-icon="sword"></canvas></div><div class="s"><canvas data-icon="pick"></canvas></div><div class="s"><canvas data-icon="bread"></canvas><b>4</b></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"><canvas data-icon="block"></canvas><b>16</b></div>
      </div>
    </div>
  </div>
</div>
<div class="note"><span>Chest, inventory and menu skins</span><span>Framed with hearthside:planks</span><span>Merge-ready pack</span></div>
<script src="/scripts/gaming/banners/ui/_pixel.js"></script>
<script type="module">
  import { EXTRA_TEXTURES } from "/scripts/gaming/banners/voxel-blocks.mjs"
  const c = document.createElement("canvas")
  c.width = 16
  c.height = 16
  c.getContext("2d").drawImage(EXTRA_TEXTURES.rpPlanks().image, 0, 0)
  document.getElementById("chest").style.backgroundImage = `url(${c.toDataURL()})`
  window.__ready = true
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Archivo, Inter, 'Helvetica Neue', Arial, sans-serif">
<rect width="1200" height="900" fill="#F7F3EC"/><rect x="60" y="60" width="1080" height="780" rx="10" fill="#FFFDFA" stroke="#E2DCD3" stroke-width="1"/>
<text x="110" y="130" font-size="13" fill="#6B6259" font-weight="600" text-anchor="start" opacity="1">In paragraph setting</text>
<text x="110" y="220" font-size="26" fill="#2A2521" font-weight="400" text-anchor="start" opacity="1">The quick brown fox jumps over the lazy dog while the</text><text x="110" y="272" font-size="26" fill="#2A2521" font-weight="400" text-anchor="start" opacity="1">typesetter checks the spacing between every pair of</text><text x="110" y="324" font-size="26" fill="#2A2521" font-weight="400" text-anchor="start" opacity="1">letters, because a face that looks correct in a specimen</text><text x="110" y="376" font-size="26" fill="#2A2521" font-weight="400" text-anchor="start" opacity="1">can still fall apart once it is set as running text at a</text><text x="110" y="428" font-size="26" fill="#2A2521" font-weight="400" text-anchor="start" opacity="1">size anyone would actually read it in.</text>
<text x="110" y="520" font-size="15" fill="#6B6259" font-weight="400" text-anchor="start" opacity="1">The quick brown fox jumps over the lazy dog while the</text><text x="110" y="550" font-size="15" fill="#6B6259" font-weight="400" text-anchor="start" opacity="1">typesetter checks the spacing between every pair of</text><text x="110" y="580" font-size="15" fill="#6B6259" font-weight="400" text-anchor="start" opacity="1">letters, because a face that looks correct in a specimen</text><text x="110" y="610" font-size="15" fill="#6B6259" font-weight="400" text-anchor="start" opacity="1">can still fall apart once it is set as running text at a</text><text x="110" y="640" font-size="15" fill="#6B6259" font-weight="400" text-anchor="start" opacity="1">size anyone would actually read it in.</text></svg>